<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaleidoscope Report Chat</title>
<!--
  Standalone mockup of the Kaleidoscope chat workflows: data exploration
  chats, report generation chats (template, project, facts by section,
  section notes, generate) and the Facts tab.

  Everything is hardcoded. There is no AI, no server and no map; replies are
  canned and nothing is saved when the page is reloaded.

  The report templates are copied from
  geo-ai-explorer-api/src/main/resources/report-templates/*.json.
-->
<style>
:root {
  --surface-ground: #f6f7f9;
  --surface-card: #ffffff;
  --surface-section: #f8fafc;
  --surface-muted: #eef2f6;
  --surface-hover: #f0f2f5;
  --surface-border: #d9dee7;
  --text-color: #172033;
  --text-color-secondary: #64748b;
  --primary-color: #10b981;
  --primary-contrast: #ffffff;
  --primary-soft: #e0f2f1;
  --code-background: rgba(15, 23, 42, 0.08);
  --warning: #b45309;
  --warning-edge: #f59e0b;
  --fact-icon: #d97706;
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.18);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface-ground: #0b1120;
    --surface-card: #111827;
    --surface-section: #172033;
    --surface-muted: #1e293b;
    --surface-hover: #253248;
    --surface-border: #334155;
    --text-color: #e5edf7;
    --text-color-secondary: #a8b5c7;
    --primary-color: #34d399;
    --primary-contrast: #052e24;
    --primary-soft: #123c38;
    --code-background: rgba(148, 163, 184, 0.16);
    --warning: #fbbf24;
    --warning-edge: #d97706;
    --fact-icon: #fbbf24;
    --shadow-floating: 0 8px 24px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --surface-ground: #0b1120;
  --surface-card: #111827;
  --surface-section: #172033;
  --surface-muted: #1e293b;
  --surface-hover: #253248;
  --surface-border: #334155;
  --text-color: #e5edf7;
  --text-color-secondary: #a8b5c7;
  --primary-color: #34d399;
  --primary-contrast: #052e24;
  --primary-soft: #123c38;
  --code-background: rgba(148, 163, 184, 0.16);
  --warning: #fbbf24;
  --warning-edge: #d97706;
  --fact-icon: #fbbf24;
  --shadow-floating: 0 8px 24px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--surface-ground);
  color: var(--text-color);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
}

button, input, select, textarea { font: inherit; color: inherit; }

.icon {
  width: 1em;
  height: 1em;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: -0.125em;
}

/* ---------- Shell ---------- */

.demo-badge {
  display: block;
  margin-bottom: 6px;
  padding: 4px 8px;
  border: 1px dashed var(--warning-edge);
  border-radius: 6px;
  color: var(--warning);
  font-weight: 600;
}

.top-actions {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 40;
  display: flex;
  gap: 0.5rem;
}

.top-action {
  display: inline-grid;
  place-items: center;
  width: 2.75rem;
  height: 2.75rem;
  border: 1px solid var(--surface-border);
  border-radius: 999px;
  background: var(--surface-card);
  box-shadow: var(--shadow-floating);
  font-size: 1.2rem;
  cursor: pointer;
}

.top-action:hover { color: var(--primary-color); border-color: var(--primary-color); }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  border: 2px solid var(--surface-border);
  background: var(--surface-card);
  overflow: hidden;
}

/* ---------- Sidebar ---------- */

.sidebar {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px;
  border-right: 1px solid var(--surface-border);
  background: var(--surface-section);
  overflow: hidden;
}

.sidebar-tabs {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 4px;
  padding: 2px;
  border: 1px solid var(--surface-border);
  border-radius: 8px;
  background: var(--surface-muted);
}

.sidebar-tab {
  min-width: 0;
  padding: 7px 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-color-secondary);
  font-size: 0.82rem;
  font-weight: 650;
  cursor: pointer;
}

.sidebar-tab.active {
  background: var(--surface-card);
  color: var(--text-color);
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
}

.list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-right: 2px;
}

.conv {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 7px 8px;
  border: 1px solid var(--surface-border);
  border-radius: 8px;
  background: var(--surface-card);
  text-align: left;
  cursor: pointer;
}

.conv:hover { background: var(--surface-hover); }
.conv.active { background: var(--primary-soft); border-color: var(--primary-color); }

.conv-type { color: var(--text-color-secondary); font-size: 0.85rem; }
.conv-type.report { color: var(--primary-color); }

.conv-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 0.88rem;
}

.conv-title-input {
  flex: 1 1 auto;
  min-width: 0;
  padding: 0.2rem 0.35rem;
  border: 1px solid var(--surface-border);
  border-radius: 4px;
  background: var(--surface-card);
}

.conv-btn {
  display: inline-grid;
  place-items: center;
  width: 1.5rem;
  height: 1.5rem;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  font-size: 0.8rem;
  opacity: 0.65;
  cursor: pointer;
}

.conv-btn:hover { opacity: 1; background: var(--code-background); }

.chooser { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }

.chooser-option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border: 1px solid var(--surface-border);
  border-radius: 8px;
  background: var(--surface-card);
  text-align: left;
  cursor: pointer;
}

.chooser-option:hover, .chooser-option:focus-visible {
  border-color: var(--primary-color);
  background: var(--primary-soft);
}

.chooser-option .icon { margin-top: 2px; color: var(--text-color-secondary); }
.chooser-option .icon.report { color: var(--primary-color); }
.chooser-name { display: block; font-size: 0.9rem; font-weight: 650; }
.chooser-desc { display: block; color: var(--text-color-secondary); font-size: 0.78rem; line-height: 1.3; }

.new-chat {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--surface-border);
  border-radius: 6px;
  background: var(--surface-muted);
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
}

.new-chat:hover { background: var(--surface-hover); }
.new-chat.cancel { background: var(--text-color); color: var(--surface-card); border-color: var(--text-color); }

.card {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  width: 100%;
  padding: 7px 8px;
  border: 1px solid var(--surface-border);
  border-radius: 8px;
  background: var(--surface-card);
  text-align: left;
  cursor: pointer;
}

.card:hover { background: var(--surface-hover); }

.card-title { display: flex; gap: 6px; align-items: baseline; font-weight: 650; line-height: 1.2; font-size: 0.9rem; }
.card-meta { color: var(--text-color-secondary); font-size: 0.78rem; line-height: 1.3; }
.fact-icon { color: var(--fact-icon); font-size: 0.85rem; }

.card-actions { display: flex; justify-content: flex-end; gap: 4px; width: 100%; padding-top: 2px; }

.card-action {
  display: inline-grid;
  place-items: center;
  width: 1.7rem;
  height: 1.7rem;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 999px;
  background: transparent;
  color: var(--text-color-secondary);
  cursor: pointer;
}

.card-action:hover { background: var(--code-background); }

.fact-details { display: flex; flex-direction: column; gap: 6px; width: 100%; margin-top: 4px; }
.fact-text { margin: 0; font-size: 0.82rem; line-height: 1.4; }

.fact-statements {
  margin: 0;
  padding: 6px 8px;
  border-radius: 6px;
  background: var(--code-background);
  font-size: 0.72rem;
  white-space: pre-wrap;
  word-break: break-word;
}

.group-heading {
  flex: 0 0 auto;
  margin: 6px 2px 0;
  color: var(--text-color-secondary);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.group-heading:first-child { margin-top: 0; }

.empty { margin: 8px 4px; color: var(--text-color-secondary); font-size: 0.85rem; text-align: center; }

.sidebar-note {
  flex: 0 0 auto;
  margin: 0;
  padding: 0.65rem 0.25rem 0;
  border-top: 1px solid var(--surface-border);
  color: var(--text-color-secondary);
  font-size: 0.76rem;
  line-height: 1.3;
}

/* ---------- Main ---------- */

.main {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.main.report-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(340px, 36%, 500px);
  grid-template-rows: minmax(0, 1fr);
}

.chat-column {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.report-layout .chat-column { border-left: 1px solid var(--surface-border); }

.pane-header {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 3.75rem;
  padding: 8px 14px;
  border-bottom: 1px solid var(--surface-border);
}

.pane-header h2 { margin: 0 6px 0 0; font-size: 0.95rem; }
.chat-column .pane-header { padding-right: calc(3.5rem + 14px); }
.pane-header .icon { color: var(--primary-color); }

.chip {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 2px 8px;
  border: 1px solid var(--primary-color);
  border-radius: 999px;
  background: var(--primary-soft);
  font-size: 0.78rem;
  font-weight: 600;
}

.chip.empty {
  border-style: dashed;
  border-color: var(--surface-border);
  background: transparent;
  color: var(--text-color-secondary);
  font-weight: 500;
}

/* ---------- Messages ---------- */

.messages {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column-reverse;
  gap: 10px;
  padding: 10px 10px 4px;
}

.message {
  width: min(100%, 900px);
  align-self: center;
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.message.user { flex-direction: row-reverse; }

.avatar {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 6px;
  background: var(--surface-muted);
  color: var(--text-color-secondary);
  font-size: 1.3rem;
}

.avatar svg.logo { width: 1.9rem; height: auto; }

.bubble {
  min-width: 0;
  max-width: 85%;
  padding: 8px 12px;
  border-radius: 8px;
  line-height: 1.45;
  font-size: 0.92rem;
}

.message.user .bubble { background: var(--primary-soft); }
.message.system .bubble { border: 1px solid var(--surface-border); background: var(--surface-section); }

.empty-chat {
  margin: auto;
  max-width: 34rem;
  padding: 24px;
  color: var(--text-color-secondary);
  text-align: center;
  font-size: 0.9rem;
  line-height: 1.5;
}

.empty-chat strong { display: block; margin-bottom: 4px; color: var(--text-color); font-size: 1rem; }

.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 0.6em; }
.md h1, .md h2, .md h3 { margin: 0.8em 0 0.35em; line-height: 1.25; }
.md h1 { font-size: 1.15rem; }
.md h2 { font-size: 1.02rem; }
.md h3 { font-size: 0.95rem; }
.md ul, .md ol { margin: 0 0 0.6em; padding-left: 1.3em; }
.md blockquote { margin: 0 0 0.6em; padding: 2px 10px; border-left: 3px solid var(--warning-edge); color: var(--text-color-secondary); }
.md code { padding: 1px 4px; border-radius: 4px; background: var(--code-background); font-size: 0.88em; }
.md table { margin: 0 0 0.6em; border-collapse: collapse; font-size: 0.86em; }
.md th, .md td { padding: 3px 6px; border: 1px solid var(--surface-border); text-align: left; vertical-align: top; }
.md th { background: var(--surface-muted); }
.md a { color: var(--primary-color); }
.md hr { margin: 0.8em 0; border: 0; border-top: 1px solid var(--surface-border); }

.dots { display: inline-flex; gap: 4px; padding: 4px 0; }
.dots span { width: 7px; height: 7px; border-radius: 50%; background: #9880ff; animation: dot 1s infinite ease-in-out; }
.dots span:nth-child(2) { animation-delay: 0.15s; }
.dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes dot { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

.input-row {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin: 6px 10px 10px;
  padding: 8px;
  border: 1px solid var(--surface-border);
  border-radius: 10px;
  background: var(--surface-card);
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
}

.input-row:focus-within { border-color: var(--primary-color); }

.input-row textarea {
  flex: 1 1 auto;
  min-width: 0;
  max-height: 180px;
  padding: 7px 4px;
  border: 0;
  background: transparent;
  resize: none;
  outline: none;
  overflow-y: hidden;
  line-height: 1.4;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 14px;
  border: 1px solid var(--primary-color);
  border-radius: 6px;
  background: var(--primary-color);
  color: var(--primary-contrast);
  font-weight: 650;
  cursor: pointer;
}

.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.secondary { border-color: var(--surface-border); background: var(--surface-muted); color: var(--text-color); padding: 8px 10px; }

/* ---------- Report setup ---------- */

.setup {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface-section);
}

.setup-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  /* One step after another, top to bottom */
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 12px 14px 14px;
}

.step { min-width: 0; display: flex; flex-direction: column; gap: 6px; }

.step-title {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0;
  font-size: 0.82rem;
  font-weight: 700;
}

.step-number {
  display: inline-grid;
  place-items: center;
  width: 1.2rem;
  height: 1.2rem;
  border-radius: 999px;
  background: var(--primary-color);
  color: var(--primary-contrast);
  font-size: 0.7rem;
}

.coverage { margin-left: auto; color: var(--warning); font-size: 0.75rem; font-weight: 600; }
.coverage.complete { color: var(--primary-color); }

.hint { margin: 0; color: var(--text-color-secondary); font-size: 0.8rem; }

.template {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 8px 10px;
  border: 1px solid var(--surface-border);
  border-radius: 8px;
  background: var(--surface-card);
  cursor: pointer;
}

.template:hover { background: var(--surface-hover); }
.template.selected { border-color: var(--primary-color); background: var(--primary-soft); box-shadow: inset 3px 0 0 var(--primary-color); }
.template-name { font-weight: 650; font-size: 0.88rem; }
.template-options {
  /* Templates side by side, wrapping onto more rows as needed */
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  align-items: start;
  gap: 8px;
}

.template-regulation {
  /* Citations can run several lines; the full text is in the tooltip */
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
  color: var(--text-color-secondary);
  font-size: 0.75rem;
  line-height: 1.3;
}
.template-regulation a { color: inherit; }

.optional { color: var(--text-color-secondary); font-size: 0.7rem; font-style: italic; font-weight: 500; }

.project-select {
  width: 100%;
  max-width: 28rem;
  padding: 7px 8px;
  border: 1px solid var(--surface-border);
  border-radius: 6px;
  background: var(--surface-card);
  font-size: 0.85rem;
}

.sections { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }

.section {
  display: grid;
  grid-template-columns: minmax(160px, 1fr) minmax(0, 2fr);
  align-items: center;
  gap: 4px 12px;
  padding: 6px 8px;
  border: 1px solid var(--surface-border);
  border-radius: 6px;
  background: var(--surface-card);
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease;
}

.section:not(.expanded):hover { background: var(--surface-hover); }
.section:hover .section-name { color: var(--primary-color); }
.section.expanded { border-color: var(--primary-color); }
.section.missing { border-left: 3px solid var(--warning-edge); }

.section-header {
  display: flex;
  align-items: baseline;
  gap: 6px;
  min-width: 0;
  margin: -6px 0 -6px -8px;
  padding: 6px 4px 6px 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  font-size: 0.82rem;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
}

.section-header:focus-visible { outline: 2px solid var(--primary-color); outline-offset: -2px; }
.section-chevron { width: 0.7rem; color: var(--text-color-secondary); font-size: 0.7rem; }
.section-heading { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 6px; }
.has-notes { color: var(--text-color-secondary); font-size: 0.75rem; }
.needs-content { color: var(--warning); font-size: 0.7rem; font-weight: 600; }

.section-facts { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; min-width: 0; }

.fact-chip {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  max-width: 100%;
  padding: 1px 2px 1px 8px;
  border: 1px solid var(--primary-color);
  border-radius: 999px;
  background: var(--primary-soft);
  font-size: 0.76rem;
}

.fact-chip.unassigned { border-style: dashed; border-color: var(--warning-edge); background: transparent; }
.fact-chip-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.chip-remove {
  display: inline-grid;
  place-items: center;
  width: 1.2rem;
  height: 1.2rem;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--text-color-secondary);
  font-size: 0.7rem;
  cursor: pointer;
}

.chip-remove:hover { background: var(--code-background); color: var(--text-color); }

.add-fact {
  max-width: 11rem;
  padding: 2px 6px;
  border: 1px dashed var(--surface-border);
  border-radius: 999px;
  background: transparent;
  color: var(--primary-color);
  font-size: 0.76rem;
  font-weight: 600;
  cursor: pointer;
}

.add-fact:hover, .add-fact:focus { border-color: var(--primary-color); outline: none; }
.add-fact option { color: var(--text-color); background: var(--surface-card); }

.section-details {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 4px;
  padding: 10px 0 2px 1.1rem;
  border-top: 1px solid var(--surface-border);
  cursor: default;
}

.details-label {
  margin: 0 0 3px;
  color: var(--text-color-secondary);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.details-label .aside { margin-left: 4px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.section-summary { margin: 0; font-size: 0.82rem; line-height: 1.45; }
.section-example summary { cursor: pointer; }

.section-example-body {
  max-height: 280px;
  overflow: auto;
  margin-top: 4px;
  padding: 8px 10px;
  border: 1px solid var(--surface-border);
  border-radius: 6px;
  background: var(--surface-section);
  font-size: 0.8rem;
  line-height: 1.45;
}

.section-notes { display: flex; flex-direction: column; }

.section-notes textarea {
  width: 100%;
  min-height: 4.5rem;
  padding: 6px 8px;
  border: 1px solid var(--surface-border);
  border-radius: 6px;
  background: var(--surface-card);
  font-size: 0.84rem;
  line-height: 1.4;
  resize: vertical;
}

.section-notes textarea:focus { border-color: var(--primary-color); outline: none; }

.unassigned-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.unassigned-label { color: var(--warning); font-size: 0.75rem; font-weight: 600; }

.generate {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px 14px;
  padding-top: 12px;
  border-top: 1px solid var(--surface-border);
}

.generate-hint { color: var(--text-color-secondary); font-size: 0.8rem; }
.generate-hint.warning { color: var(--warning); }

/* ---------- Narrow screens ---------- */

@media (max-width: 1000px) {
  .main.report-layout {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 45%) minmax(0, 1fr);
  }

  .report-layout .chat-column { border-left: 0; border-top: 1px solid var(--surface-border); }
  .report-layout .chat-column .pane-header { display: none; }
  .setup .pane-header { padding-right: calc(3.5rem + 14px); }
}

@media (max-width: 700px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .sidebar { max-height: 210px; border-right: 0; border-bottom: 1px solid var(--surface-border); }
  .section { grid-template-columns: 1fr; }
  .top-actions { top: auto; bottom: 4.5rem; }
}
</style>

e residual risk of flooding. ...\n\n[Figure 34: Life Safety Hazard Zones for the Valley View (left) and Combination (right) Plans, 1% AEP]\n\nThe OSE analysis also considered critical infrastructure resiliency. There are 11 structures flagged as critical infrastructure in the FWOP 0.2% AEP event floodplain, including the Canoas Creek Elementary School that will be impacted by flooding at less than 3ft of flood depths. The nonstructural alternative removes two critical structures from the floodplain while the other nine remain unprotected. The structural alternatives remove all 11 critical structures from the floodplain.",

const LOGO = '<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="3" width="22" height="18" rx="3" fill="#DE1E2E"/><path d="M5 17V9h2v2h2V8h2v3h2V8h2v3h2V9h2v8z" fill="#fff"/></svg>';

const icon = (name, cls = '') => `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const projectOf = r => PROJECTS.find(p => p.id === r?.projectId);
const factById = id => FACTS.find(f => f.id === id);

/** Just enough Markdown for the template examples and canned replies. */
function markdown(src) {
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])[*_](?!\s)(.+?)[*_](?=[\s).,;:]|$)/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const lines = String(src ?? '').split('\n');
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    if (!line.trim()) { i++; continue; }

    if (/^\s*-{3,}\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

    const heading = /^(#{1,3})\s+(.*)$/.exec(line);
    if (heading) {
      out.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`);
      i++;
      continue;
    }

    if (/^\s*\|/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      const [head, ...rest] = body;
      out.push('<table><thead><tr>' + cells(head).map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
        + rest.map(r => '<tr>' + cells(r).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }

    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ''));
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}>` + items.map(it => `<li>${inline(it)}</li>`).join('') + `</${tag}>`);
      continue;
    }

    if (/^>\s?/.test(line)) {
      const quote = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote>${quote.map(inline).join('<br>')}</blockquote>`);
      continue;
    }

    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|\s*\||\s*([-*]|\d+\.)\s+|>|\s*-{3,}\s*$)/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${para.map(inline).join('<br>')}</p>`);
  }

  return out.join('');
}

/* ================= Report logic ================= */

function hasContent(report, section) {
  return (report.sectionFacts[section.name]?.length ?? 0) > 0 || (report.sectionNotes[section.name]?.trim().length ?? 0) > 0;
}

function coverage(report) {
  const required = templateOf(report)?.sections.filter(s => s.required) ?? [];
  return { covered: required.filter(s => hasContent(report, s)).length, total: required.length };
}

function unassigned(report) {
  const template = templateOf(report);
  const placed = new Set((template?.sections ?? []).flatMap(s => report.sectionFacts[s.name] ?? []));
  return report.factIds.filter(id => !placed.has(id)).map(factById).filter(Boolean);
}

function removeFromReport(report, factId) {
  report.factIds = report.factIds.filter(id => id !== factId);
  for (const name of Object.keys(report.sectionFacts)) {
    report.sectionFacts[name] = report.sectionFacts[name].filter(id => id !== factId);
  }
}

function buildReport(report) {
  const template = templateOf(report);
  const project = projectOf(report);
  const out = [`# ${template.name}`, `**${project.name}** · draft generated from ${report.factIds.length} facts`, ''];
  const gaps = [];

  template.sections.forEach((section, index) => {
    const facts = (report.sectionFacts[section.name] ?? []).map(factById).filter(Boolean);
    const notes = report.sectionNotes[section.name]?.trim();

    if (!facts.length && !notes) {
      if (section.required) {
        gaps.push(section.name);
        out.push(`## ${index + 1}. ${section.name}`, '> Needs input: no facts or notes were assigned to this required section.', '');
      }
      return;
    }

    out.push(`## ${index + 1}. ${section.name}`);
    if (notes) out.push(notes, '');
    if (facts.length) out.push(facts.map(f => f.text).join(' '), '');
  });

  out.push('---', gaps.length
    ? `${gaps.length} required section${gaps.length === 1 ? '' : 's'} still need${gaps.length === 1 ? 's' : ''} input. Add facts or notes on the left and generate again, or tell me how to handle ${gaps.length === 1 ? 'it' : 'them'}.`
    : 'Every required section has content. Ask me to expand, shorten or rewrite any section.');

  return out.join('\n');
}

  'There are **2 hospitals** inside the 1% floodplain:\n\n| Hospital | Beds |\n|---|---|\n| Regional Medical Center | 420 |\n| St. Luke\'s Community Hospital | 190 |',
  'The levee system protects about **$2.1B** of real property across 4 leveed areas. Most of that value (about 68%) is residential.'
];

const REPORT_REPLIES = [
  'Sure. I\'ll keep that in mind when drafting. Use **Generate report** when the sections look right, or ask me about any section.',
  'The **Benefit-Cost Analysis and Net Public Benefits** section should report annualized costs, benefits, net benefits and the benefit-cost ratio for each alternative, with the price level, period of analysis and discount rate stated in a footnote.'
];

let replyIndex = { exploration: 0, report: 0 };

function send(conv, text, reply) {
  text = text.trim();
  if (!text || ui.pending.has(conv.id)) return;

  conv.messages.push({ sender: 'user', text });

  if (conv.title === 'New chat' || conv.title === 'New report') {
    conv.title = text.length > 28 ? text.substring(0, 28) + '...' : text;
  }

  ui.pending.add(conv.id);
  render();

  setTimeout(() => {
    const list = conv.type === 'report' ? REPORT_REPLIES : EXPLORE_REPLIES;
    conv.messages.push({ sender: 'system', text: reply ? reply() : list[replyIndex[conv.type]++ % list.length] });
    ui.pending.delete(conv.id);
    render();
  }, reply ? 1400 : 900);
}

function newConversation(type) {
  const conv = {
    id: uid(), type, title: type === 'report' ? 'New report' : 'New chat', messages: [], draft: '',
    report: type === 'report' ? { templateId: null, projectId: null, factIds: [], sectionFacts: {}, sectionNotes: {} } : undefined
  };
  conversations.unshift(conv);
  ui.activeId = conv.id;
  ui.tab = 'chat';
  ui.choosing = false;
  ui.expandedSections.clear();
  return conv;
}

function renderMessages(conv) {
  const items = conv.messages.map(m => `
    <div class="message ${m.sender}">
      <div class="avatar">${m.sender === 'user' ? icon('user') : LOGO}</div>
      <div class="bubble ${m.sender === 'system' ? 'md' : ''}">${m.sender === 'system' ? markdown(m.text) : esc(m.text)}</div>
    </div>`);

  if (ui.pending.has(conv.id)) {
    items.push(`<div class="message system"><div class="avatar">${LOGO}</div><div class="bubble"><span class="dots"><span></span><span></span><span></span></span></div></div>`);
  }

  if (!items.length) {
    items.push(conv.type === 'report'
      ? '<div class="empty-chat"><strong>Report assistant</strong>Pick a template and project, place facts in sections, then generate. You can also ask questions about the template here.</div>'
      : '<div class="empty-chat"><strong>Data exploration</strong>Ask about locations, flood risk and population. Useful findings can be saved as facts for reports.</div>');
  }

  return '<div class="messages">' + items.reverse().join('') + '</div>';
}

function renderInput(conv) {
  let placeholder = 'Type a message...';
  if (conv.type === 'report') {
    placeholder = !conv.report.templateId || conv.report.projectId == null
      ? 'Describe your report...'
      : 'Ask the report assistant...';
  }
  return `<div class="input-row">
    <button type="button" class="btn secondary" title="Erase conversation" data-action="erase">${icon('erase')}</button>
    <textarea id="chat-input" rows="1" placeholder="${placeholder}" aria-label="Message">${esc(conv.draft)}</textarea>
    <button type="button" class="btn" data-action="send" ${ui.pending.has(conv.id) ? 'disabled' : ''}>Send</button>
  </div>`;
}

function renderSetup(conv) {
  const r = conv.report;
  const template = templateOf(r);
  const project = projectOf(r);
  const projectFacts = FACTS.filter(f => f.projectId === r.projectId);
  const cov = coverage(r);
  const loose = unassigned(r);

  const templates = TEMPLATES.map(t => `
    <div class="template ${r.templateId === t.id ? 'selected' : ''}" role="radio" tabindex="0" aria-checked="${r.templateId === t.id}" data-action="select-template" data-id="${t.id}">
      <span class="template-name">${esc(t.name)}</span>
      ${t.regulation ? `<span class="template-regulation" title="${esc(t.regulation)}">${t.regulationUrl
        ? `<a href="${esc(t.regulationUrl)}" target="_blank" rel="noopener" data-action="noop">${esc(t.regulation)}</a>`
        : esc(t.regulation)}</span>` : ''}
    </div>`).join('');

  let step3;
  if (r.projectId == null) {
    step3 = '<p class="hint">Pick a project to see its facts.</p>';
  } else if (!projectFacts.length) {
    step3 = '<p class="hint">This project has no facts yet. Save some from a data exploration chat.</p>';
  } else if (!template) {
    step3 = '<p class="hint">Pick a template to assign facts to its sections.</p>';
  } else {
    step3 = '<ol class="sections">' + template.sections.map((s, index) => {
      const ids = r.sectionFacts[s.name] ?? [];
      const facts = ids.map(factById).filter(Boolean);
      const assignable = projectFacts.filter(f => !ids.includes(f.id));
      const open = ui.expandedSections.has(s.name);
      const notes = r.sectionNotes[s.name] ?? '';
      const missing = s.required && !hasContent(r, s);

      return `<li class="section ${open ? 'expanded' : ''} ${missing ? 'missing' : ''}" data-action="toggle-section" data-index="${index}">
        <button type="button" class="section-header" aria-expanded="${open}" aria-controls="section-details-${index}">
          <span class="section-chevron">${icon(open ? 'down' : 'right')}</span>
          <span class="section-heading">
            <span class="section-name">${esc(s.name)}</span>
            ${notes.trim() ? `<span class="has-notes" title="Has notes">${icon('note')}</span>` : ''}
            ${!s.required ? '<span class="optional">optional</span>' : missing ? '<span class="needs-content">needs content</span>' : ''}
          </span>
        </button>
        <div class="section-facts">
          ${facts.map(f => `<span class="fact-chip" title="${esc(f.description)}"><span class="fact-chip-name">${esc(f.name)}</span>
            <button type="button" class="chip-remove" aria-label="Remove ${esc(f.name)} from ${esc(s.name)}" data-action="unassign-fact" data-index="${index}" data-id="${f.id}">${icon('x')}</button></span>`).join('')}
          ${assignable.length ? `<select class="add-fact" aria-label="Add a fact to ${esc(s.name)}" data-action="noop" data-change="assign-fact" data-index="${index}">
            <option value="" selected>+ Add fact</option>
            ${assignable.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('')}
          </select>` : ''}
        </div>
        ${open ? `<div class="section-details" id="section-details-${index}" data-action="noop">
          <div>
            <h4 class="details-label">What this section covers</h4>
            <p class="section-summary">${esc(s.summary)}</p>
          </div>
          ${s.example ? `<details class="section-example" data-example="${esc(s.name)}" ${ui.openExamples.has(s.name) ? 'open' : ''}>
            <summary class="details-label">Example from a previous report <span class="aside">different project, for structure and tone only</span></summary>
            <div class="md section-example-body">${markdown(s.example)}</div>
          </details>` : ''}
          <label class="section-notes">
            <span class="details-label">Your notes</span>
            <textarea rows="3" data-notes="${index}" placeholder="Add text, decisions or context for the agent to use in this section…">${esc(notes)}</textarea>
          </label>
        </div>` : ''}
      </li>`;
    }).join('') + '</ol>';
  }

  if (loose.length) {
    step3 += '<div class="unassigned-row"><span class="unassigned-label">Not in a section yet:</span>' + loose.map(f =>
      `<span class="fact-chip unassigned" title="${esc(f.description)}"><span class="fact-chip-name">${esc(f.name)}</span>
        <button type="button" class="chip-remove" aria-label="Remove ${esc(f.name)} from the report" data-action="remove-fact-from-report" data-id="${f.id}">${icon('x')}</button></span>`).join('') + '</div>';
  }

  const missingCount = cov.total - cov.covered;
  const canGenerate = template && project && !ui.pending.has(conv.id);

  return `<section class="setup" aria-label="Report setup">
    <header class="pane-header">
      ${icon('report')}
      <h2>Report setup</h2>
      <span class="chip ${template ? '' : 'empty'}">${esc(template?.name ?? 'No template')}</span>
      <span class="chip ${project ? '' : 'empty'}">${esc(project?.name ?? 'No project')}</span>
      <span class="chip ${r.factIds.length ? '' : 'empty'}">${r.factIds.length} fact${r.factIds.length === 1 ? '' : 's'}</span>
    </header>
    <div class="setup-body">
      <div class="step">
        <h3 class="step-title"><span class="step-number">1</span> Template</h3>
        <div class="template-options" role="radiogroup" aria-label="Report template">${templates}</div>
      </div>
      <div class="step">
        <h3 class="step-title"><span class="step-number">2</span> Project</h3>
        <select class="project-select" aria-label="Project" data-change="select-project">
          <option value="" ${r.projectId == null ? 'selected' : ''} disabled>Select a project…</option>
          ${PROJECTS.map(p => `<option value="${p.id}" ${r.projectId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
        </select>
      </div>
      <div class="step">
        <h3 class="step-title"><span class="step-number">3</span> Facts by section
          ${template && cov.total ? `<span class="coverage ${missingCount === 0 ? 'complete' : ''}">${cov.covered} of ${cov.total} required sections covered</span>` : ''}
        </h3>
        ${step3}
      </div>
      <div class="generate">
        ${!template || !project
          ? '<span class="generate-hint">Pick a template and a project to generate.</span>'
          : missingCount > 0
            ? `<span class="generate-hint warning">${missingCount} required section${missingCount === 1 ? '' : 's'} still need${missingCount === 1 ? 's' : ''} content. The agent will ask how to handle them.</span>`
            : ''}
        <button type="button" class="btn" data-action="generate" ${canGenerate ? '' : 'disabled'}>${icon('report')}<span>${ui.pending.has(conv.id) ? 'Generating…' : 'Generate report'}</span></button>
      </div>
    </div>
  </section>`;
}

function renderMain() {
  const conv = active();
  const main = document.getElementById('main');

  if (!conv) { main.innerHTML = ''; return; }

  main.classList.toggle('report-layout', conv.type === 'report');
  main.innerHTML = (conv.type === 'report' ? renderSetup(conv) : '')
    + '<div class="chat-column">'
    + (conv.type === 'report' ? '<header class="pane-header"><h2>Report assistant</h2></header>' : '')
    + renderMessages(conv) + renderInput(conv)
    + '</div>';

function render() {
  // Keep the setup pane's scroll position across re-renders
  const scroller = document.querySelector('.setup-body');
  const scrollTop = scroller?.scrollTop ?? 0;

  renderSidebar();
  renderMain();

  const nextScroller = document.querySelector('.setup-body');
  if (nextScroller) nextScroller.scrollTop = scrollTop;

  document.getElementById('theme-toggle').innerHTML = icon(isDark() ? 'sun' : 'moon');

  if (ui.focus) {
    const el = document.querySelector(ui.focus);
    if (el) { el.focus(); if (el.select && ui.focus === '#rename-input') el.select(); }
    ui.focus = null;
  }
}

/* ================= Events ================= */

function isDark() {
  const theme = document.documentElement.dataset.theme;
  return theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}

const actions = {
  'noop': () => {},
  'toggle-theme': () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; },
  'tab': el => { ui.tab = el.dataset.tab; },
  'toggle-chooser': () => { ui.choosing = !ui.choosing; },
  'new-conv': el => { newConversation(el.dataset.type); ui.focus = '#chat-input'; },
  'select-conv': el => {
    if (ui.activeId !== el.dataset.id) ui.expandedSections.clear();
    ui.activeId = el.dataset.id;
  },
  'rename-conv': el => { ui.editingId = el.dataset.id; ui.focus = '#rename-input'; },
  'delete-conv': el => {
    const conv = conversations.find(c => c.id === el.dataset.id);
    if (!confirm(`Delete "${conv.title}"? This cannot be undone.`)) return false;
    conversations = conversations.filter(c => c.id !== conv.id);
    if (ui.activeId === conv.id) ui.activeId = conversations[0].id;
  },
  'delete-query': el => {
    const q = SAVED_QUERIES.find(x => x.id === el.dataset.id);
    if (!confirm(`Delete "${q.title}" from saved queries?`)) return false;
    SAVED_QUERIES = SAVED_QUERIES.filter(x => x !== q);
  },
  'expand-fact': el => { const id = Number(el.dataset.id); ui.expandedFactId = ui.expandedFactId === id ? null : id; },
  'remove-fact-from-report': el => { const conv = active(); if (conv.report) removeFromReport(conv.report, Number(el.dataset.id)); },
  'delete-fact': el => {
    const fact = factById(Number(el.dataset.id));
    if (!confirm(`Delete "${fact.name}"? Reports will no longer be able to use it.`)) return false;
    FACTS = FACTS.filter(f => f !== fact);
    conversations.forEach(c => c.report && removeFromReport(c.report, fact.id));
  },
  'select-template': el => {
    const r = active().report;
    r.templateId = r.templateId === el.dataset.id ? null : el.dataset.id;
    const names = new Set(templateOf(r)?.sections.map(s => s.name) ?? []);
    r.sectionFacts = Object.fromEntries(Object.entries(r.sectionFacts).filter(([n]) => names.has(n)));
    ui.expandedSections.clear();
  },
  'toggle-section': el => {
    const name = templateOf(active().report).sections[Number(el.dataset.index)].name;
    ui.expandedSections.has(name) ? ui.expandedSections.delete(name) : ui.expandedSections.add(name);
  },
  'unassign-fact': el => {
    const r = active().report;
    const name = templateOf(r).sections[Number(el.dataset.index)].name;
    const id = Number(el.dataset.id);
    r.sectionFacts[name] = (r.sectionFacts[name] ?? []).filter(x => x !== id);
    if (!Object.values(r.sectionFacts).some(ids => ids.includes(id))) r.factIds = r.factIds.filter(x => x !== id);
  },
  'send': () => {
    const conv = active();
    const text = conv.draft;
    conv.draft = '';
    send(conv, text);
    ui.focus = '#chat-input';
    return false;
  },
  'generate': () => {
    const conv = active();
    const report = conv.report;
    send(conv, 'Generate the report from the selected template, facts and section notes.', () => buildReport(report));
    return false;
  },
  'erase': () => {
    const conv = active();
    if (!conv.messages.length || !confirm('Erase this conversation\'s messages?')) return false;
    conv.messages = [];
    conv.title = conv.type === 'report' ? 'New report' : 'New chat';
  }
};

document.addEventListener('click', event => {
  const el = event.target.closest('[data-action]');
  if (!el) return;
  if (el.closest('#sidebar') && ui.editingId && el.id !== 'rename-input') finishRename();
  const result = actions[el.dataset.action]?.(el, event);
  if (result !== false && el.dataset.action !== 'noop') render();
});

document.addEventListener('keydown', event => {
  const el = event.target;

  if (el.id === 'rename-input') {
    if (event.key === 'Enter') finishRename();
    if (event.key === 'Escape') { ui.editingId = null; render(); }
    return;
  }

  if (el.id === 'chat-input' && event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    actions.send();
    return;
  }

  // Keyboard activation for div[role=button|radio] rows
  if ((event.key === 'Enter' || event.key === ' ') && el.matches('[role="button"][data-action], [role="radio"][data-action]')) {
    event.preventDefault();
    el.click();
  }
});

document.addEventListener('focusout', event => {
  if (event.target.id === 'rename-input' && ui.editingId) finishRename();
});

// <details> toggles don't bubble, so listen in the capture phase
document.addEventListener('toggle', event => {
  const name = event.target.dataset?.example;
  if (name == null) return;
  event.target.open ? ui.openExamples.add(name) : ui.openExamples.delete(name);
}, true);

document.addEventListener('input', event => {
  const el = event.target;

  if (el.id === 'chat-input') {
    active().draft = el.value;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 180) + 'px';
    el.style.overflowY = el.scrollHeight > 180 ? 'auto' : 'hidden';
  }

  if (el.dataset.notes != null) {
    const r = active().report;
    const name = templateOf(r).sections[Number(el.dataset.notes)].name;
    if (el.value) r.sectionNotes[name] = el.value; else delete r.sectionNotes[name];

    // Re-render so coverage, the note icon and the Generate hint stay current,
    // then put the cursor back where it was
    const index = el.dataset.notes;
    const start = el.selectionStart, end = el.selectionEnd;
    render();
    const again = document.querySelector(`[data-notes="${index}"]`);
    if (again) { again.focus(); again.setSelectionRange(start, end); }
  }
});

document.addEventListener('change', event => {
  const el = event.target;
  const r = active()?.report;

  if (el.dataset.change === 'select-project' && r) {
    const id = Number(el.value);
    if (r.projectId !== id) { r.projectId = id; r.factIds = []; r.sectionFacts = {}; }
    render();
  }

  if (el.dataset.change === 'assign-fact' && r) {
    const name = templateOf(r).sections[Number(el.dataset.index)].name;
    const id = Number(el.value);
    const ids = r.sectionFacts[name] ?? [];
    if (!ids.includes(id)) r.sectionFacts[name] = [...ids, id];
    if (!r.factIds.includes(id)) r.factIds.push(id);
    render();
  }
});

function finishRename() {
  if (!ui.editingId) return;
  const input = document.getElementById('rename-input');
  const conv = conversations.find(c => c.id === ui.editingId);
  if (conv && input) conv.title = input.value.trim() || (conv.type === 'report' ? 'New report' : 'New chat');
  ui.editingId = null;
  render();
}

render();
</script>
</body>
</html>
